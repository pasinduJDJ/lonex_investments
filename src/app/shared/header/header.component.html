<header class="lx-global-header" role="banner">
  <div class="lx-header-inner container-fluid">
    
    <!-- Left Section: Only 9-dots Home Button -->
    <div class="lx-header-left">
      <a 
        routerLink="/home" 
        class="lx-app-switcher-btn" 
        [class.active]="isHome"
        title="Home" 
        aria-label="Return to Main Application Launcher"
      >
        <i class="bi bi-grid-3x3-gap-fill"></i>
        <span class="visually-hidden">Home</span>
      </a>
    </div>

    <!-- Right Section: Theme Toggle, Notifications, and User Profile Dropdown -->
    <div class="lx-header-right">
      
      <!-- Color Theme Switcher -->
      <button
        type="button"
        (click)="toggleTheme()"
        class="lx-theme-toggle-btn"
        [title]="themeService.isDarkMode() ? 'Switch to Light Mode' : 'Switch to Dark Mode'"
        aria-label="Toggle light or dark theme"
      >
        <i [class]="themeService.isDarkMode() ? 'bi bi-sun-fill text-warning' : 'bi bi-moon-stars-fill'"></i>
        <span class="d-none d-sm-inline lx-theme-label">{{ themeService.isDarkMode() ? 'Light' : 'Dark' }}</span>
      </button>

      <!-- Notifications Icon (Right Side, next to Theme Toggle) -->
      <div class="lx-notifications-wrapper position-relative">
        <button 
          type="button" 
          class="lx-header-icon-btn position-relative" 
          (click)="toggleNotifications($event)"
          [class.active]="isNotificationsOpen"
          title="Notifications"
          aria-label="View notifications"
          [attr.aria-expanded]="isNotificationsOpen"
        >
          <i class="bi bi-bell-fill"></i>
          <span *ngIf="unreadNotificationsCount > 0" class="lx-notification-badge">
            {{ unreadNotificationsCount }}
          </span>
        </button>

        <!-- Notifications Dropdown Popover -->
        <div *ngIf="isNotificationsOpen" class="lx-popover lx-notifications-popover shadow-lg" (click)="$event.stopPropagation()">
          <div class="lx-popover-header d-flex justify-content-between align-items-center">
            <span class="fw-bold" style="font-family: var(--lx-font-subtitles); font-size: 0.875rem;">Notifications</span>
            <span class="badge badge-secondary" style="font-size: 0.7rem;">Stage 1</span>
          </div>
          <div class="lx-popover-body text-center py-4 px-3">
            <div class="lx-notification-empty-icon mb-2">
              <i class="bi bi-bell-slash text-muted" style="font-size: 1.75rem;"></i>
            </div>
            <p class="mb-1 fw-semibold" style="font-size: 0.875rem; color: var(--lx-text-primary);">All caught up!</p>
            <p class="text-muted mb-0" style="font-size: 0.775rem;">No unread system alerts or pending notifications.</p>
          </div>
        </div>
      </div>

      <!-- User Profile Dropdown -->
      <div class="lx-user-menu-wrapper position-relative">
        <button 
          type="button" 
          class="lx-user-btn" 
          (click)="toggleUserDropdown($event)"
          [class.active]="isUserDropdownOpen"
          aria-label="User profile and account settings"
          [attr.aria-expanded]="isUserDropdownOpen"
        >
          <div class="lx-user-avatar">
            <span>{{ userInitials }}</span>
          </div>
          <div class="lx-user-details d-none d-lg-block text-start">
            <span class="lx-user-name">{{ userEmail.split('@')[0] }}</span>
            <span class="lx-user-role">Manager</span>
          </div>
          <i class="bi bi-chevron-down lx-user-chevron ms-1"></i>
        </button>

        <!-- User Dropdown Menu -->
        <div *ngIf="isUserDropdownOpen" class="lx-popover lx-user-popover shadow-lg" (click)="$event.stopPropagation()">
          <div class="lx-user-popover-header">
            <div class="d-flex align-items-center gap-2 mb-1">
              <div class="lx-user-avatar-sm">{{ userInitials }}</div>
              <div class="overflow-hidden">
                <div class="fw-bold text-truncate" style="font-family: var(--lx-font-subtitles); font-size: 0.85rem;">{{ userEmail }}</div>
                <div class="text-muted" style="font-size: 0.75rem;">Lonex Enterprise</div>
              </div>
            </div>
          </div>
          
          <div class="lx-user-popover-body py-1">
            <a routerLink="/home" (click)="closeDropdowns()" class="lx-dropdown-item">
              <i class="bi bi-grid-3x3-gap"></i>
              <span>All Modules (Home)</span>
            </a>
            <a routerLink="/profile" (click)="closeDropdowns()" class="lx-dropdown-item">
              <i class="bi bi-person-gear"></i>
              <span>Profile & Password</span>
            </a>
            <a routerLink="/member" (click)="closeDropdowns()" class="lx-dropdown-item">
              <i class="bi bi-people"></i>
              <span>Customers</span>
            </a>
            <a routerLink="/loan" (click)="closeDropdowns()" class="lx-dropdown-item">
              <i class="bi bi-cash-coin"></i>
              <span>Loans</span>
            </a>
            <a routerLink="/profit" (click)="closeDropdowns()" class="lx-dropdown-item">
              <i class="bi bi-wallet2"></i>
              <span>Finance</span>
            </a>
            
            <div class="dropdown-divider my-1"></div>

            <button type="button" (click)="logout()" class="lx-dropdown-item lx-dropdown-logout text-danger">
              <i class="bi bi-box-arrow-right"></i>
              <span>Logout</span>
            </button>
          </div>
        </div>

      </div>

    </div>

  </div>
</header>
